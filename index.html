<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immune Map</title>
<style>
:root {
  --bg: #0b1220;
  --bg-2: #0f1830;
  --panel: #131d36;
  --panel-2: #1a2745;
  --line: #24334f;
  --ink: #e7edf8;
  --ink-dim: #93a3bd;
  --accent: #5aa9e6;
  --good: #43c59e;
  --bad: #e5544b;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; }

/* ---------------------------------------------------------------- top bar */

#topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 18px;
  height: 58px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: .2px; }
.brand .dot {
  width: 13px; height: 13px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #7fdca4, #43c59e 55%, #2a8f74);
  box-shadow: 0 0 12px rgba(67, 197, 158, .55);
}

#modes { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 8px; }
.mode {
  border: 0; background: transparent; color: var(--ink-dim);
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 550;
}
.mode:hover { color: var(--ink); }
.mode.active { background: var(--panel-2); color: var(--ink); }

.tools { margin-left: auto; display: flex; align-items: center; gap: 18px; }

.search { position: relative; }
#search {
  width: 260px; padding: 7px 11px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; font-family: inherit;
}
#search:focus { outline: none; border-color: var(--accent); }
#search::placeholder { color: #6b7d99; }

#results {
  position: absolute; top: 38px; left: 0; right: 0; z-index: 40;
  margin: 0; padding: 4px; list-style: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  max-height: 320px; overflow-y: auto;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
}
#results:empty { display: none; }
#results li {
  padding: 7px 9px; border-radius: 6px; font-size: 13px;
  display: flex; align-items: center; gap: 8px;
}
#results li:hover, #results li.on { background: var(--panel-2); }
#results .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#results .kind { margin-left: auto; color: var(--ink-dim); font-size: 11px; }

#progress { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
#progress .bar { width: 90px; height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
#bar-fill { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s; }

/* ------------------------------------------------------------------ stage */

main { display: flex; height: calc(100% - 58px); }

#stage { position: relative; flex: 1; min-width: 0; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; }
#graph.panning { cursor: grabbing; }

#hint {
  position: absolute; left: 16px; bottom: 14px;
  font-size: 11.5px; color: #61738f;
  pointer-events: none;
}

#arrow path { fill: #2c3d5e; }
#arrow-lit path { fill: #5aa9e6; }

/* edges */
.edge { stroke: #2c3d5e; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
.edge.lit { stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-lit); }
.edge.path { stroke: var(--good); stroke-width: 2.4; marker-end: url(#arrow-lit); }
.edge-label {
  fill: var(--ink-dim); font-size: 9.5px; text-anchor: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  pointer-events: none; opacity: 0;
}
.edge-label.show { opacity: 1; }

/* nodes */
.node { cursor: pointer; }
.node circle {
  stroke: rgba(255, 255, 255, .18); stroke-width: 1.2;
  transition: stroke-width .15s;
}
.node.sel circle { stroke: #fff; stroke-width: 2.4; }
.node.goal circle { stroke: var(--good); stroke-width: 3; }
.node.here circle { stroke: #fff; stroke-width: 3; }
.node text {
  fill: var(--ink); font-size: 11.5px; text-anchor: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
  pointer-events: none; font-weight: 500;
}
.node.fade { opacity: .25; }
.node .pip {
  fill: none; stroke: rgba(255, 255, 255, .5); stroke-width: 1.1; stroke-dasharray: 2 3;
}

/* remove-from-map button, shown on the selected node */
.node-remove { cursor: pointer; display: none; }
.node-remove circle { fill: var(--panel-2); stroke: var(--bad); stroke-width: 1.3; }
.node-remove text {
  fill: var(--bad); font-size: 12px; text-anchor: middle; font-weight: 700;
  stroke: none; pointer-events: none;
}
.node-remove:hover circle { fill: var(--bad); }
.node-remove:hover text { fill: #fff; }

/* wheel */
#wheel-layer .spoke { stroke: #3a4d73; stroke-width: 1.2; }
#wheel-layer .chip rect {
  fill: var(--panel-2); stroke: var(--line); stroke-width: 1; rx: 13;
}
#wheel-layer .chip:hover rect { fill: #24365f; stroke: var(--accent); }
#wheel-layer .chip.known rect { stroke-dasharray: 3 3; }
#wheel-layer .chip.more rect { fill: transparent; stroke: #3a4d73; }
#wheel-layer .chip.more text { fill: var(--ink-dim); }
#wheel-layer .chip text { fill: var(--ink); font-size: 11.5px; text-anchor: middle; }
#wheel-layer .chip .rel { fill: var(--ink-dim); font-size: 9.5px; }
#wheel-layer .chip { cursor: pointer; }
#wheel-layer .hub {
  fill: rgba(11, 18, 32, .9); stroke: var(--line); stroke-width: 1;
}
#wheel-layer .back:hover .hub { stroke: var(--accent); }
#wheel-layer .back { cursor: pointer; }
#wheel-layer .back text { fill: var(--ink-dim); font-size: 10.5px; text-anchor: middle; }

/* ---------------------------------------------------------------- side bar */

#side {
  width: 320px; flex: none; background: var(--bg-2); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; overflow-y: auto;
}
#side h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-dim); margin: 0 0 10px; font-weight: 650;
}
#info, #starters, #legend { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.placeholder { color: var(--ink-dim); font-size: 13px; line-height: 1.55; margin: 0; }

#info .kind {
  display: inline-block; font-size: 10.5px; padding: 3px 8px; border-radius: 20px;
  margin-bottom: 9px; font-weight: 600; letter-spacing: .03em;
}
#info h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.25; }
#info .desc { font-size: 13px; line-height: 1.6; color: #c3cfe3; margin: 0 0 12px; }
#info .meta { font-size: 12px; color: var(--ink-dim); margin: 0 0 12px; line-height: 1.6; }
#info .meta b { color: #c3cfe3; font-weight: 550; }

.rel-group { margin-bottom: 10px; }
.rel-group h4 {
  font-size: 11px; color: var(--ink-dim); margin: 0 0 5px; font-weight: 550;
  text-transform: lowercase;
}
.rel-group .pill {
  display: inline-block; font-size: 12px; padding: 3px 9px; margin: 0 4px 4px 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  color: #cfd9ea; cursor: pointer;
}
.rel-group .pill:hover { border-color: var(--accent); color: #fff; }

#info .actions { display: flex; gap: 8px; margin-top: 12px; }

#starter-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
#starter-buttons button {
  font-size: 12px; padding: 5px 10px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); color: #cfd9ea;
}
#starter-buttons button:hover { border-color: var(--accent); color: #fff; }

#legend-items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-dim); }
.legend-item i { width: 9px; height: 9px; border-radius: 50%; flex: none; }

#side-foot {
  padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; margin-top: auto;
}
#side-foot .row { display: flex; gap: 8px; }
button.wide { width: 100%; padding: 9px 12px; }

button.ghost {
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim);
  padding: 6px 12px; border-radius: 7px; font-size: 12px;
}
button.ghost:hover { color: var(--ink); border-color: var(--accent); }
button.primary {
  background: var(--accent); border: 1px solid var(--accent); color: #06101f;
  padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;
}

/* --------------------------------------------------------------- game panel */

#game-panel {
  position: absolute; left: 16px; top: 16px; width: 380px; z-index: 20;
  background: rgba(19, 29, 54, .96); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .5);
}
#game-head { display: flex; align-items: center; margin-bottom: 8px; }
#game-title { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-dim); font-weight: 650; }
#game-score { margin-left: auto; font-size: 12px; color: var(--ink-dim); }
#game-score b { color: var(--good); }
#game-prompt { font-size: 14px; line-height: 1.55; margin: 0 0 10px; }
#game-prompt em { color: var(--accent); font-style: normal; font-weight: 600; }

#game-path { font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; line-height: 1.7; }
#game-path .step { color: var(--ink); }
#game-path .arrow { margin: 0 5px; color: #4a5d80; }

#game-choices { display: flex; flex-direction: column; gap: 6px; }
#game-choices button {
  text-align: left; background: var(--panel); border: 1px solid var(--line);
  color: var(--ink); padding: 8px 11px; border-radius: 8px; font-size: 13px;
  display: flex; align-items: center; gap: 8px;
}
#game-choices button:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-2); }
#game-choices button:disabled { cursor: default; opacity: .85; }
#game-choices button.right { border-color: var(--good); background: rgba(67, 197, 158, .14); }
#game-choices button.wrong { border-color: var(--bad); background: rgba(229, 84, 75, .14); }
#game-choices .rel { color: var(--ink-dim); font-size: 11px; }
#game-choices .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }

#game-foot { display: flex; gap: 8px; margin-top: 12px; }

.caveat {
  font-size: 11.5px; line-height: 1.55; margin: 8px 0 0; padding: 8px 10px;
  border-radius: 7px; color: var(--ink-dim);
  background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
}

.feedback { font-size: 12.5px; line-height: 1.5; margin: 10px 0 0; padding: 8px 10px; border-radius: 7px; }
.feedback.ok { background: rgba(67, 197, 158, .12); color: #8fe3c8; }
.feedback.no { background: rgba(229, 84, 75, .12); color: #f0a29c; }

/* ------------------------------------------------------- narrow screens
   The two-column layout assumes a laptop. Below this width the sidebar
   would squeeze the map into a useless sliver, so the map goes on top at
   full width and everything else stacks underneath it. Dragging and
   pinching a graph on a phone is still awkward — this makes a small
   screen workable, not comfortable. */
@media (max-width: 860px) {
  html, body { overflow: auto; }
  main { flex-direction: column; height: auto; min-height: calc(100% - 58px); }
  #stage { height: 62vh; min-height: 320px; flex: none; }
  #side {
    width: 100%; border-left: 0; border-top: 1px solid var(--line);
    overflow-y: visible;
  }
  #topbar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 10px 14px; }
  .tools { margin-left: 0; width: 100%; gap: 10px; }
  #search { width: 100%; }
  .search { flex: 1; }
  #hint { font-size: 10.5px; right: 12px; bottom: 8px; }
  #game-panel { width: auto; left: 10px; right: 10px; top: 10px; }
  #legend-items { grid-template-columns: 1fr 1fr; }
}

</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Immune Map</h1>
  </div>

  <nav id="modes">
    <button class="mode active" data-mode="explore">Explore</button>
    <button class="mode" data-mode="trace">Trace</button>
    <button class="mode" data-mode="quiz">Quiz</button>
  </nav>

  <div class="tools">
    <div class="search">
      <input id="search" type="text" placeholder="Find a cell, cytokine, receptor…" autocomplete="off" spellcheck="false">
      <ul id="results"></ul>
    </div>
    <div id="progress" title="Nodes you have uncovered">
      <div class="bar"><span id="bar-fill"></span></div>
      <span id="progress-text">0 / 0</span>
    </div>
  </div>
</header>

<main>
  <div id="stage">
    <svg id="graph">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
        <marker id="arrow-lit" viewBox="0 0 10 10" refX="10" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="edge-layer"></g>
        <g id="node-layer"></g>
        <g id="wheel-layer"></g>
      </g>
    </svg>

    <div id="hint">Click a node to open its wheel &middot; drag to move &middot; scroll to zoom
      &middot; &times; or Delete removes a node from the map</div>

    <div id="game-panel" hidden>
      <div id="game-head">
        <span id="game-title">Trace</span>
        <span id="game-score"></span>
      </div>
      <p id="game-prompt"></p>
      <div id="game-path"></div>
      <div id="game-choices"></div>
      <div id="game-foot">
        <button id="game-back" class="ghost" hidden>&larr; Back</button>
        <button id="game-next" class="ghost">Skip</button>
        <button id="game-restart" class="ghost">New round</button>
      </div>
    </div>
  </div>

  <aside id="side">
    <div id="info" class="empty">
      <p class="placeholder">Pick a starting point below, or search above.</p>
    </div>

    <div id="starters">
      <h3>Start somewhere</h3>
      <div id="starter-buttons"></div>
    </div>

    <div id="legend">
      <h3>Legend</h3>
      <div id="legend-items"></div>
    </div>

    <div id="side-foot">
      <button id="show-all" class="primary wide">Show the whole map</button>
      <div class="row">
        <button id="reset-view" class="ghost">Clear map</button>
        <button id="reset-progress" class="ghost">Reset progress</button>
      </div>
    </div>
  </aside>
</main>

<script>
/* Immune Map — an explorable graph of immunology built from data/immunology_map.xlsx.
   Three modes share one graph: Explore (free roam), Trace (find the pathway),
   Quiz (rapid recall). Everything here is driven by data.js, so growing the
   workbook grows the game with no changes to this file. */

(function () {
'use strict';

var DATA = window.IMMUNO_DATA;
var TYPES = DATA.types;
var RELS = DATA.relations;

var NODE = {};
DATA.nodes.forEach(function (n) { NODE[n.id] = n; });

/* Adjacency, both directions. `phrase` is how the link reads when you walk it
   from `id` towards `other` — "produces" one way, "produced by" the other. */
var ADJ = {};
DATA.nodes.forEach(function (n) { ADJ[n.id] = []; });
DATA.edges.forEach(function (e, i) {
  e.i = i;
  ADJ[e.s].push({ id: e.t, rel: e.r, dir: 'out', phrase: RELS[e.r].label, edge: e });
  ADJ[e.t].push({ id: e.s, rel: e.r, dir: 'in', phrase: RELS[e.r].inverse, edge: e });
});

function color(id) { return (TYPES[NODE[id].type] || TYPES.other).color; }
function label(id) { return NODE[id].label; }
function radius(id) {
  var d = NODE[id].deg || 1;
  return Math.max(8, Math.min(18, 7 + Math.sqrt(d) * 1.7));
}

/* ------------------------------------------------------------------ storage */

var SAVE_KEY = 'immune-map-v1';
var save = { found: {}, traceBest: 0, quizBest: 0 };
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) { var p = JSON.parse(raw); if (p && p.found) save = p; }
} catch (err) { /* private browsing, no saving; not fatal */ }

function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (err) {}
}

function discover(id) {
  if (!save.found[id]) { save.found[id] = 1; persist(); }
  paintProgress();
}

function paintProgress() {
  var total = DATA.nodes.length;
  var n = Object.keys(save.found).length;
  $('bar-fill').style.width = (100 * n / total) + '%';
  $('progress-text').textContent = n + ' / ' + total;
}

/* ------------------------------------------------------------------- helpers */

function $(id) { return document.getElementById(id); }

function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function textWidth(s) { return s.length * 6.4; }

/* Shortest path over the undirected view of the graph. */
function shortestPath(from, to) {
  if (from === to) return [from];
  var prev = {}, seen = {}, queue = [from];
  seen[from] = 1;
  while (queue.length) {
    var cur = queue.shift();
    for (var i = 0; i < ADJ[cur].length; i++) {
      var nb = ADJ[cur][i].id;
      if (seen[nb]) continue;
      seen[nb] = 1;
      prev[nb] = cur;
      if (nb === to) {
        var path = [to], c = to;
        while (c !== from) { c = prev[c]; path.unshift(c); }
        return path;
      }
      queue.push(nb);
    }
  }
  return null;
}

function distanceMap(from) {
  var dist = {}; dist[from] = 0;
  var queue = [from];
  while (queue.length) {
    var cur = queue.shift();
    for (var i = 0; i < ADJ[cur].length; i++) {
      var nb = ADJ[cur][i].id;
      if (dist[nb] === undefined) { dist[nb] = dist[cur] + 1; queue.push(nb); }
    }
  }
  return dist;
}

/* --------------------------------------------------------------- graph view */

var svg = $('graph');
var viewport = $('viewport');
var edgeLayer = $('edge-layer');
var nodeLayer = $('node-layer');
var wheelLayer = $('wheel-layer');

var view = { x: 0, y: 0, k: 1 };
var live = {};        // id -> {id, x, y, vx, vy, pinned}
var liveEdges = [];   // edges with both ends visible
var selected = null;
var pathHighlight = {}; // "s|r|t" -> true, drawn in the trace colour
var mode = 'explore';
var alpha = 0;
var wholeMap = false;   // the whole-graph view thins labels and skips discovery
var near = {};          // selected node + its neighbours, kept labelled

function size() {
  var r = svg.getBoundingClientRect();
  return { w: r.width, h: r.height };
}

/* The trace/quiz panel floats over the left of the stage, so in those modes the
   graph settles to the right of it rather than underneath. */
function panelInset() { return mode === 'explore' ? 0 : 210; }

function centre() {
  var s = size();
  var cx = (s.w + panelInset()) / 2;
  return { x: (cx - view.x) / view.k, y: (s.h / 2 - view.y) / view.k };
}

function addNode(id, near) {
  if (live[id]) return live[id];
  var c = near && live[near] ? live[near] : centre();
  var a = Math.random() * Math.PI * 2;
  var d = near ? 90 + Math.random() * 40 : Math.random() * 120;
  live[id] = { id: id, x: c.x + Math.cos(a) * d, y: c.y + Math.sin(a) * d, vx: 0, vy: 0 };
  discover(id);
  refreshEdges();
  alpha = 1;
  return live[id];
}

function removeNode(id) {
  delete live[id];
  if (wheel && wheel.id === id) wheel = null;
  refreshEdges();               // must precede select(), which redraws
  if (selected === id) select(null);
  alpha = 0.6;
  draw();
}

function clearGraph() {
  live = {};
  liveEdges = [];
  pathHighlight = {};
  wheel = null;
  wholeMap = false;
  select(null);
  draw();
}

function refreshEdges() {
  liveEdges = DATA.edges.filter(function (e) { return live[e.s] && live[e.t]; });
}

/* Belt and braces: one stale edge must never be able to kill the render loop. */
function edgesToDraw() {
  return liveEdges.filter(function (e) { return live[e.s] && live[e.t]; });
}

function expand(id, limit) {
  var list = ADJ[id].slice(0, limit || 999);
  list.forEach(function (nb) { addNode(nb.id, id); });
}

/* Every node at once — the paper concept map, but you can pull it apart.
   Seeded on a phyllotaxis spiral so the layout starts evenly spread rather than
   exploding out of one point, then settled off-screen before the first frame. */
function showWholeMap() {
  clearGraph();
  var c = centre();
  var golden = Math.PI * (3 - Math.sqrt(5));

  DATA.nodes.forEach(function (n, i) {
    var r = 24 * Math.sqrt(i + 0.5);
    var a = i * golden;
    live[n.id] = {
      id: n.id,
      x: c.x + Math.cos(a) * r,
      y: c.y + Math.sin(a) * r,
      vx: 0, vy: 0
    };
  });
  refreshEdges();

  // Settle synchronously so the map appears composed instead of writhing.
  // A bigger graph needs longer to stop moving.
  alpha = 1;
  var steps = Math.min(900, 320 + DATA.nodes.length * 1.5);
  for (var i = 0; i < steps; i++) step();
  alpha = 0.05;

  wholeMap = true;
  fitView();
  draw();
}

/* Frame the visible nodes, leaving room for the labels.

   Framing the outright extremes is a trap: one lightly connected node flung
   wide shrinks everything else to nothing. So the bounds cover the bulk of the
   map and a few stragglers are left to be found by scrolling. */
function fitView() {
  var ids = Object.keys(live);
  if (!ids.length) return;

  var xs = [], ys = [];
  ids.forEach(function (id) { xs.push(live[id].x); ys.push(live[id].y); });
  xs.sort(function (a, b) { return a - b; });
  ys.sort(function (a, b) { return a - b; });
  var cut = Math.floor(xs.length * 0.02);
  var pad0 = 26;
  var minX = xs[cut] - pad0, maxX = xs[xs.length - 1 - cut] + pad0;
  var minY = ys[cut] - pad0, maxY = ys[ys.length - 1 - cut] + pad0;
  if (!(maxX > minX)) { minX -= 100; maxX += 100; }
  if (!(maxY > minY)) { minY -= 100; maxY += 100; }

  var s = size();
  var pad = 28, left = panelInset();
  // A hidden or freshly-opened window can report no size at all; fitting to
  // that would throw the map off screen, so leave the view alone.
  if (s.w - left - pad * 2 <= 0 || s.h - pad * 2 <= 0) return;
  var k = Math.min((s.w - left - pad * 2) / (maxX - minX),
                   (s.h - pad * 2) / (maxY - minY));
  view.k = Math.max(0.12, Math.min(1.6, k));
  view.x = left + (s.w - left) / 2 - ((minX + maxX) / 2) * view.k;
  view.y = s.h / 2 - ((minY + maxY) / 2) * view.k;
}

/* ------------------------------------------------------------------ physics */

function step() {
  var ids = Object.keys(live);
  if (!ids.length || alpha < 0.005) return;

  var i, j, a, b, dx, dy, dist, force;

  // A crowd needs more elbow room than a handful of nodes, or the whole map
  // collapses into an unreadable knot.
  var crowd = ids.length > 60;
  var push = crowd ? 9000 : 5200;
  var gap = crowd ? 26 : 46;
  var linkLen = crowd ? 96 : 132;
  var pull = crowd ? 0.0075 : 0.0022;   // a big graph needs real gravity, or it streaks

  for (i = 0; i < ids.length; i++) {
    a = live[ids[i]];
    for (j = i + 1; j < ids.length; j++) {
      b = live[ids[j]];
      dx = b.x - a.x; dy = b.y - a.y;
      dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var min = radius(a.id) + radius(b.id) + gap;
      force = push / (dist * dist);
      if (dist < min) force += (min - dist) * 0.34;   // hard-ish collision
      var ux = dx / dist, uy = dy / dist;
      a.vx -= ux * force; a.vy -= uy * force;
      b.vx += ux * force; b.vy += uy * force;
    }
  }

  for (i = 0; i < liveEdges.length; i++) {
    a = live[liveEdges[i].s]; b = live[liveEdges[i].t];
    if (!a || !b) continue;
    dx = b.x - a.x; dy = b.y - a.y;
    dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
    force = (dist - linkLen) * 0.028;
    var ex = (dx / dist) * force, ey = (dy / dist) * force;
    a.vx += ex; a.vy += ey;
    b.vx -= ex; b.vy -= ey;
  }

  var c = centre();
  for (i = 0; i < ids.length; i++) {
    a = live[ids[i]];
    a.vx += (c.x - a.x) * pull;
    a.vy += (c.y - a.y) * pull;
    if (a.pinned) { a.vx = a.vy = 0; continue; }
    a.vx *= 0.82; a.vy *= 0.82;
    a.x += a.vx * alpha;
    a.y += a.vy * alpha;
  }

  alpha *= 0.985;
}

/* ------------------------------------------------------------------ drawing */

var nodeEls = {}, edgeEls = {};

function draw() {
  viewport.setAttribute('transform',
    'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');

  // edges
  var drawable = edgesToDraw();

  // Work out which links share a pair of nodes, and give each one a lane so
  // they fan out instead of stacking. Lanes are symmetric about the straight
  // line (a lone link keeps lane 0 and stays straight); the sign is flipped for
  // links pointing the other way so a two-way pair bows to opposite sides.
  var bundles = {}, laneOf = {};
  drawable.forEach(function (e) {
    var pair = e.s < e.t ? e.s + '␀' + e.t : e.t + '␀' + e.s;
    (bundles[pair] = bundles[pair] || []).push(e);
  });
  Object.keys(bundles).forEach(function (pair) {
    var group = bundles[pair];
    if (group.length < 2) return;
    group.sort(function (p, q) {
      return (p.s + p.r).localeCompare(q.s + q.r);
    });
    var first = group[0].s;
    group.forEach(function (e, i) {
      var lane = i - (group.length - 1) / 2;
      // The perpendicular is derived from each link's own direction, so a
      // reversed link needs its lane negated to land in the same frame as the
      // rest — which is exactly what puts a two-way pair on opposite sides.
      laneOf[e.s + '|' + e.r + '|' + e.t] = e.s === first ? lane : -lane;
    });
  });

  var keep = {};
  drawable.forEach(function (e) {
    var key = e.s + '|' + e.r + '|' + e.t;
    keep[key] = 1;
    var g = edgeEls[key];
    if (!g) {
      g = { line: svgEl('path', { class: 'edge' }), text: svgEl('text', { class: 'edge-label' }) };
      edgeLayer.appendChild(g.line);
      edgeLayer.appendChild(g.text);
      g.text.textContent = RELS[e.r].label;
      edgeEls[key] = g;
    }
    var a = live[e.s], b = live[e.t];
    var dx = b.x - a.x, dy = b.y - a.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / d, uy = dy / d;

    // Two nodes can be joined more than once — B cells produce IgM and IgM is
    // performed by them, macrophages both produce and are stimulated by TNF.
    // Drawn straight, those lines sit on top of each other and their labels
    // become an unreadable pile, so each link in a bundle is bowed out by its
    // own amount and carries its label on its own arc.
    var lane = laneOf[key] || 0;               // 0, ±1, ±2 … around the centre
    var bow = lane * 30;
    var px = -uy * bow, py = ux * bow;         // perpendicular offset
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var cx = mx + px * 2, cy = my + py * 2;    // quadratic control point

    // Trim to the rim of each circle along the direction the curve leaves it.
    var sdx = cx - a.x, sdy = cy - a.y;
    var sd = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
    var edx = cx - b.x, edy = cy - b.y;
    var ed = Math.sqrt(edx * edx + edy * edy) || 1;
    var x1 = a.x + (sdx / sd) * (radius(e.s) + 2);
    var y1 = a.y + (sdy / sd) * (radius(e.s) + 2);
    var x2 = b.x + (edx / ed) * (radius(e.t) + 7);
    var y2 = b.y + (edy / ed) * (radius(e.t) + 7);

    g.line.setAttribute('d', bow
      ? 'M' + x1 + ',' + y1 + 'Q' + cx + ',' + cy + ' ' + x2 + ',' + y2
      : 'M' + x1 + ',' + y1 + 'L' + x2 + ',' + y2);

    var lit = selected && (e.s === selected || e.t === selected);
    var onPath = pathHighlight[key];
    var lineCls = 'edge' + (onPath ? ' path' : lit ? ' lit' : '');
    if (g.lineCls !== lineCls) { g.line.setAttribute('class', lineCls); g.lineCls = lineCls; }

    // Positioning an invisible label is pure cost, and at 1200 edges it shows.
    var showLabel = lit || onPath;
    if (showLabel) {
      // Bowing the lines apart separates the labels perpendicular to the line,
      // which is not enough on a steep edge: horizontal text is far wider than
      // it is tall. So slide each label along its own curve as well, into the
      // space the line direction always provides.
      var t = 0.5 + lane * 0.14;
      var it = 1 - t;
      g.text.setAttribute('x', it * it * x1 + 2 * it * t * cx + t * t * x2);
      g.text.setAttribute('y', it * it * y1 + 2 * it * t * cy + t * t * y2 - 4);
    }
    var textCls = 'edge-label' + (showLabel ? ' show' : '');
    if (g.textCls !== textCls) { g.text.setAttribute('class', textCls); g.textCls = textCls; }
  });
  Object.keys(edgeEls).forEach(function (key) {
    if (!keep[key]) {
      edgeLayer.removeChild(edgeEls[key].line);
      edgeLayer.removeChild(edgeEls[key].text);
      delete edgeEls[key];
    }
  });

  // nodes
  Object.keys(nodeEls).forEach(function (id) {
    if (!live[id]) { nodeLayer.removeChild(nodeEls[id].g); delete nodeEls[id]; }
  });
  Object.keys(live).forEach(function (id) {
    var g = nodeEls[id];
    if (!g) {
      var group = svgEl('g', { class: 'node' });
      var circle = svgEl('circle', { r: radius(id), fill: color(id) });
      var pip = svgEl('circle', { class: 'pip', r: radius(id) + 5 });
      var text = svgEl('text', { y: radius(id) + 14 });
      text.textContent = label(id);

      // A ✕ on the selected node: the plain way to take something back off the
      // map once you have pulled it on.
      var r = radius(id);
      var rm = svgEl('g', { class: 'node-remove', transform:
        'translate(' + (r * 0.78 + 3) + ',' + (-r * 0.78 - 3) + ')' });
      rm.appendChild(svgEl('circle', { r: 7.5 }));
      var rmx = svgEl('text', { y: 3.2 });
      rmx.textContent = '×';
      rm.appendChild(rmx);
      rm.addEventListener('pointerdown', function (ev) {
        ev.stopPropagation();
        removeNode(id);
      });

      group.appendChild(pip);
      group.appendChild(circle);
      group.appendChild(text);
      group.appendChild(rm);
      group.addEventListener('pointerdown', onNodeDown);
      group.addEventListener('contextmenu', function (ev) {
        ev.preventDefault();
        if (mode === 'explore') removeNode(id);
      });
      group.__id = id;
      nodeLayer.appendChild(group);
      g = nodeEls[id] = { g: group, pip: pip, text: text, rm: rm };
    }
    var p = live[id];
    g.g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');

    var cls = 'node';
    if (id === selected) cls += ' sel';
    if (trace.on && id === trace.goal) cls += ' goal';
    if (trace.on && id === trace.at) cls += ' here';
    if (g.cls !== cls) { g.g.setAttribute('class', cls); g.cls = cls; }

    // On the whole map every label at once is a grey smear, so zoomed out only
    // the hubs stay named — plus whatever you have selected and its neighbours.
    var showText = !wholeMap || view.k >= 0.78 || near[id] ||
                   NODE[id].deg >= (view.k >= 0.5 ? 9 : 15);
    if (g.showText !== showText) {
      g.text.style.display = showText ? '' : 'none';
      g.showText = showText;
    }

    // dashed ring = this node still has neighbours you have not opened
    var hidden = ADJ[id].some(function (nb) { return !live[nb.id]; });
    if (g.hidden !== hidden) { g.pip.style.display = hidden ? '' : 'none'; g.hidden = hidden; }

    // The remove button belongs to the selected node, and only while exploring
    // — pulling a node out mid-round would break Trace and Quiz.
    // Must be an explicit value, not '': the stylesheet hides .node-remove by
    // default, so clearing the inline style would hide it again.
    var showRm = id === selected && mode === 'explore';
    if (g.showRm !== showRm) {
      g.rm.style.display = showRm ? 'inline' : 'none';
      g.showRm = showRm;
    }
  });

  drawWheel();
}

/* Only redraw while the simulation is actually moving; every other change
   (selection, wheel, pan, zoom) calls draw() for itself. At 217 nodes and 697
   edges an idle redraw every frame is real work for no result. */
function frame() {
  if (alpha >= 0.005) { step(); draw(); }
  requestAnimationFrame(frame);
}

/* -------------------------------------------------------------------- wheel */

var wheel = null;      // {id, group: relation phrase or null, page}
var PER_PAGE = 9;      // beyond this a "more" chip pages round
var PER_PAGE_GROUPS = 14;  // relation names are short, so more fit on one ring

function openWheel(id) {
  var groups = wheelGroups(id);
  var total = ADJ[id].length;
  unpinWheel();
  // Always open on the list of relations when there is more than one, so no
  // kind of link is hidden behind a "back" the reader has to guess at. Only a
  // node whose links are all of one kind skips straight to them.
  wheel = { id: id, group: groups.length > 1 ? null : groups[0], page: 0 };
  // Hold the anchor still: a ring of chips hanging off a drifting node is
  // maddening to click.
  if (live[id]) live[id].pinned = true;
  recentre(id);
  draw();
}

function unpinWheel() {
  if (wheel && live[wheel.id]) live[wheel.id].pinned = false;
}

function closeWheel() { unpinWheel(); wheel = null; draw(); }

/* Keep the node the wheel hangs off inside the middle of the stage, so the
   ring never opens half off-screen. */
function recentre(id) {
  var p = live[id];
  if (!p) return;
  var s = size();
  var sx = p.x * view.k + view.x, sy = p.y * view.k + view.y;
  var left = panelInset(), padX = (s.w - left) * 0.28, padY = s.h * 0.22;
  if (sx > left + padX && sx < s.w - padX && sy > padY && sy < s.h - padY) return;
  view.x += (s.w + left) / 2 - sx;
  view.y += s.h / 2 - sy;
}

function wheelGroups(id) {
  var seen = [], out = [];
  ADJ[id].forEach(function (nb) {
    if (seen.indexOf(nb.phrase) === -1) { seen.push(nb.phrase); out.push(nb.phrase); }
  });
  return out;
}

function drawWheel() {
  while (wheelLayer.firstChild) wheelLayer.removeChild(wheelLayer.firstChild);
  if (!wheel || !live[wheel.id] || mode !== 'explore') return;

  var origin = live[wheel.id];
  var items;

  if (wheel.group === null) {
    items = wheelGroups(wheel.id).map(function (phrase) {
      var n = ADJ[wheel.id].filter(function (nb) { return nb.phrase === phrase; }).length;
      return { text: phrase + ' (' + n + ')', group: phrase };
    });
  } else {
    items = ADJ[wheel.id]
      .filter(function (nb) { return nb.phrase === wheel.group; })
      .map(function (nb) {
        return { text: label(nb.id), sub: nb.phrase, target: nb.id, known: !!live[nb.id] };
      });
  }
  if (!items.length) return;

  // Page long lists rather than letting the ring grow off the screen. The list
  // of relation names gets a bigger allowance than a list of node names: the
  // chips are much shorter, and this is the level where paging would hide a
  // whole kind of link behind an extra click.
  var perPage = wheel.group === null ? PER_PAGE_GROUPS : PER_PAGE;
  var pages = Math.ceil(items.length / perPage);
  if (pages > 1) {
    if (wheel.page >= pages) wheel.page = 0;
    var start = wheel.page * perPage;
    items = items.slice(start, start + perPage);
    items.push({
      text: 'more  ' + (wheel.page + 1) + '/' + pages,
      more: true
    });
  }

  var g = svgEl('g', {
    transform: 'translate(' + origin.x + ',' + origin.y + ') scale(' + (1 / view.k) + ')'
  });

  var widest = 0;
  items.forEach(function (it) { widest = Math.max(widest, textWidth(it.text) + 26); });
  var r = Math.max(132, Math.min(230, 52 + items.length * 16));
  r = Math.max(r, widest * 0.72);

  var startAngle = -Math.PI / 2;
  items.forEach(function (it, i) {
    var ang = startAngle + (i * 2 * Math.PI) / items.length;
    var x = Math.cos(ang) * r, y = Math.sin(ang) * r;
    var w = Math.max(64, textWidth(it.text) + 26);
    var h = it.sub ? 34 : 26;

    g.appendChild(svgEl('line', {
      class: 'spoke',
      x1: Math.cos(ang) * 22, y1: Math.sin(ang) * 22,
      x2: x - Math.cos(ang) * (w / 2), y2: y - Math.sin(ang) * (h / 2)
    }));

    var chip = svgEl('g', {
      class: 'chip' + (it.known ? ' known' : '') + (it.more ? ' more' : ''),
      transform: 'translate(' + x + ',' + y + ')'
    });
    chip.appendChild(svgEl('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2 }));
    var t = svgEl('text', { y: it.sub ? -1 : 4 });
    t.textContent = it.text;
    chip.appendChild(t);
    if (it.sub) {
      var s = svgEl('text', { class: 'rel', y: 11 });
      s.textContent = it.sub;
      chip.appendChild(s);
    }
    chip.addEventListener('pointerdown', function (ev) {
      ev.stopPropagation();
      if (it.more) { wheel.page++; draw(); return; }
      if (it.group) { wheel.group = it.group; wheel.page = 0; draw(); return; }
      addNode(it.target, wheel.id);
      select(it.target);
      openWheel(it.target);
    });
    g.appendChild(chip);
  });

  // Sits just under the node's own label, so it never covers the node itself.
  var stepBack = wheel.group !== null && wheelGroups(wheel.id).length > 1;
  var hubY = radius(wheel.id) + 32;
  var hub = svgEl('g', { class: 'back', transform: 'translate(0,' + hubY + ')' });
  hub.appendChild(svgEl('rect', { class: 'hub', x: -26, y: -10, width: 52, height: 20, rx: 10 }));
  var ht = svgEl('text', { y: 3.5 });
  ht.textContent = stepBack ? '← back' : 'close';
  hub.appendChild(ht);
  hub.addEventListener('pointerdown', function (ev) {
    ev.stopPropagation();
    if (stepBack) { wheel.group = null; wheel.page = 0; draw(); }
    else closeWheel();
  });
  g.appendChild(hub);

  wheelLayer.appendChild(g);
}

/* ---------------------------------------------------------------- selection */

function select(id) {
  selected = id;
  near = {};
  if (id) {
    near[id] = 1;
    ADJ[id].forEach(function (nb) { near[nb.id] = 1; });
  }
  paintInfo(id);
  draw();
}

function paintInfo(id) {
  var box = $('info');
  box.innerHTML = '';
  if (!id) {
    box.className = 'empty';
    box.appendChild(el('p', 'placeholder', 'Pick a starting point below, or search above.'));
    return;
  }
  box.className = '';
  var n = NODE[id];
  var type = TYPES[n.type] || TYPES.other;

  var kind = el('span', 'kind', type.label);
  kind.style.background = type.color + '22';
  kind.style.color = type.color;
  box.appendChild(kind);
  box.appendChild(el('h2', null, n.label));

  if (n.desc) box.appendChild(el('p', 'desc', n.desc));

  var bits = [];
  if (n.gene) bits.push('<b>Gene</b> ' + n.gene);
  if (n.cls) bits.push('<b>Class</b> ' + n.cls);
  if (n.lineage) bits.push('<b>Lineage</b> ' + n.lineage);
  if (n.compartment) bits.push('<b>Senses in</b> ' + n.compartment);
  if (n.role) bits.push('<b>Role</b> ' + n.role);
  if (n.effect) bits.push('<b>Effect</b> ' + n.effect);
  bits.push('<b>Links</b> ' + ADJ[id].length);
  var meta = el('p', 'meta');
  meta.innerHTML = bits.join('<br>');
  box.appendChild(meta);

  // neighbours grouped by how the link reads
  var byPhrase = {};
  ADJ[id].forEach(function (nb) {
    (byPhrase[nb.phrase] = byPhrase[nb.phrase] || []).push(nb);
  });
  Object.keys(byPhrase).forEach(function (phrase) {
    var group = el('div', 'rel-group');
    group.appendChild(el('h4', null, phrase));
    byPhrase[phrase].forEach(function (nb) {
      var pill = el('span', 'pill', label(nb.id));
      pill.style.borderColor = color(nb.id) + '66';
      pill.addEventListener('click', function () {
        addNode(nb.id, id);
        select(nb.id);
        if (mode === 'explore' && !wholeMap) openWheel(nb.id);
      });
      group.appendChild(pill);
    });
    box.appendChild(group);
  });

  var actions = el('div', 'actions');
  var expandBtn = el('button', 'primary', 'Expand all');
  expandBtn.addEventListener('click', function () { expand(id); closeWheel(); });
  var hideBtn = el('button', 'ghost', 'Remove from map');
  hideBtn.title = 'Take this node back off the map (or click the ✕ on it, ' +
                  'or press Delete)';
  hideBtn.addEventListener('click', function () { removeNode(id); });
  actions.appendChild(expandBtn);
  actions.appendChild(hideBtn);
  box.appendChild(actions);
}

/* ------------------------------------------------------------- interactions */

var drag = null, pan = null;

function toWorld(ev) {
  var r = svg.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left - view.x) / view.k,
    y: (ev.clientY - r.top - view.y) / view.k
  };
}

function onNodeDown(ev) {
  ev.stopPropagation();
  var id = ev.currentTarget.__id;
  var p = toWorld(ev);
  drag = { id: id, dx: live[id].x - p.x, dy: live[id].y - p.y, moved: false };
  live[id].pinned = true;
  svg.setPointerCapture(ev.pointerId);
}

svg.addEventListener('pointerdown', function (ev) {
  pan = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false };
  svg.classList.add('panning');
});

svg.addEventListener('pointermove', function (ev) {
  if (drag) {
    var p = toWorld(ev);
    live[drag.id].x = p.x + drag.dx;
    live[drag.id].y = p.y + drag.dy;
    drag.moved = true;
    alpha = Math.max(alpha, 0.25);
  } else if (pan) {
    var dx = ev.clientX - pan.x, dy = ev.clientY - pan.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
    view.x = pan.vx + dx;
    view.y = pan.vy + dy;
    draw();
  }
});

window.addEventListener('pointerup', function (ev) {
  svg.classList.remove('panning');
  if (drag) {
    live[drag.id].pinned = false;
    if (!drag.moved) {
      var id = drag.id;
      // On the whole map every neighbour is already on screen, so a wheel would
      // just cover them up: selecting lights the links instead.
      if (mode === 'trace') traceMove(id);
      else if (wholeMap) select(id);
      else { select(id); openWheel(id); }
    }
    drag = null;
  } else if (pan) {
    if (!pan.moved && mode === 'explore') closeWheel();
    pan = null;
  }
});

svg.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  var r = svg.getBoundingClientRect();
  var mx = ev.clientX - r.left, my = ev.clientY - r.top;
  var k = Math.max(0.28, Math.min(2.6, view.k * Math.exp(-ev.deltaY * 0.0016)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  draw();
}, { passive: false });

svg.addEventListener('dblclick', function (ev) { ev.preventDefault(); });

/* ------------------------------------------------------------------- search */

var searchBox = $('search'), results = $('results');

searchBox.addEventListener('input', function () {
  var q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  if (!q) return;
  DATA.nodes
    .filter(function (n) {
      // Gene symbols are searchable too, so looking up TBX21 finds T-bet.
      return n.label.toLowerCase().indexOf(q) !== -1 ||
             (n.gene && n.gene.toLowerCase().indexOf(q) !== -1);
    })
    .slice(0, 12)
    .forEach(function (n) {
      var li = el('li');
      var sw = el('span', 'swatch');
      sw.style.background = color(n.id);
      li.appendChild(sw);
      li.appendChild(el('span', null, n.label));
      var byGene = n.label.toLowerCase().indexOf(q) === -1;
      li.appendChild(el('span', 'kind',
        byGene ? n.gene : (TYPES[n.type] || TYPES.other).label));
      li.addEventListener('mousedown', function (ev) {
        ev.preventDefault();
        focusNode(n.id);
        searchBox.value = '';
        results.innerHTML = '';
      });
      results.appendChild(li);
    });
});

searchBox.addEventListener('blur', function () {
  setTimeout(function () { results.innerHTML = ''; }, 120);
});

function focusNode(id) {
  setMode('explore');
  addNode(id);
  select(id);
  if (!wholeMap) openWheel(id);
  var s = size(), p = live[id];
  view.x = s.w / 2 - p.x * view.k;
  view.y = s.h / 2 - p.y * view.k;
  if (!wholeMap) alpha = 1;   // nudging the whole map would just shake it
  draw();
}

/* --------------------------------------------------------------- trace game */

/* Hand-written scenarios. Each is checked against the current workbook before
   use, so removing something from the spreadsheet cannot break the game. */
var SCENARIOS = [
  { from: 'candida-albicans', to: 'il-22',
    text: '<em>Candida albicans</em> is invading the mucosa. Trace from the fungus to the cytokine that repairs the barrier it is breaking through.' },
  { from: 'mycobacterium-tuberculosis', to: 'granuloma-formation',
    text: 'A macrophage has swallowed <em>M. tuberculosis</em> but cannot kill it. Trace how the response ends up walling the bacterium off.' },
  { from: 'lps', to: 'fever',
    text: 'A patient has Gram-negative sepsis. Trace from the bacterial molecule that starts it to the fever the patient presents with.' },
  { from: 'schistosoma', to: 'degranulation',
    text: 'A helminth crosses the barrier. Trace from the parasite to the burst of histamine released against it.' },
  { from: 'influenza-virus', to: 'cytotoxic-killing',
    text: 'Influenza infects an airway epithelial cell. Trace from the virus to the killing of that infected cell.' },
  { from: 'il-12', to: 'ifn-gamma',
    text: 'A dendritic cell has just released IL-12. Trace from that cytokine to the one it ultimately calls forth.' },
  { from: 'treg', to: 'iga',
    text: 'Trace from the cell that keeps the healthy gut quiet to the antibody isotype secreted across the mucosa.' },
  { from: 'hiv', to: 'cytotoxic-killing',
    text: 'Trace from HIV to the mechanism that holds it in check for years, before the helper compartment finally collapses.' },
  { from: 'dectin-1', to: 'il-17',
    text: 'A dendritic cell senses beta-glucan. Trace from that receptor to the cytokine that defends the barrier.' },
  { from: 'foxp3', to: 'il-10',
    text: 'Trace from the master transcription factor of regulatory T cells to the anti-inflammatory cytokine they release.' },
  { from: 'beta-glucan', to: 'il-17',
    text: 'A sugar from a fungal cell wall is picked up at the barrier. Trace from that molecule, through the class of infection it reports, to the cytokine that answers it.' },
  { from: 'rna-viruses', to: 'cytotoxic-killing',
    text: 'An RNA virus reaches the airway epithelium. Trace from that class of infection to the killing of an infected cell.' },
  { from: 'cytosolic-double-stranded-dna', to: 'type-i-interferon',
    text: 'DNA has turned up in the cytosol, where no DNA belongs. Trace from that danger signal to the response it triggers.' },
  { from: 'lps', to: 'extracellular-bacteria',
    text: 'Trace from a single bacterial molecule to the class of infection the immune system concludes it is facing.' },
  { from: 'c3', to: 'opsonization',
    text: 'The complement cascade has reached its central protein. Trace from C3 to the coating that makes a microbe easy to swallow.' },
  { from: 'nlrp3', to: 'pyroptosis',
    text: 'A macrophage senses danger loose in its own cytosol. Trace from the sensor to the inflammatory cell death that follows.' },
  { from: 'c1q', to: 'c3-convertase',
    text: 'An antibody-coated bacterium arrives. Trace from the first protein of the classical pathway to the enzyme that cleaves C3.' }
];

var trace = { on: false, at: null, goal: null, path: [], moves: 0, par: 0, score: 0, round: 0 };

function traceStart() {
  var choice = null;
  var pool = shuffle(SCENARIOS.slice());
  for (var i = 0; i < pool.length; i++) {
    var s = pool[i];
    if (NODE[s.from] && NODE[s.to]) {
      var p = shortestPath(s.from, s.to);
      if (p && p.length >= 3) { choice = { from: s.from, to: s.to, text: s.text, par: p.length - 1 }; break; }
    }
  }
  if (!choice || trace.round % 2 === 1) choice = randomChallenge() || choice;
  if (!choice) return;

  trace.on = true;
  trace.at = choice.from;
  trace.goal = choice.to;
  trace.path = [choice.from];
  trace.keys = [null];        // edge key used to reach path[i]; null for the start
  trace.par = choice.par;
  trace.moves = choice.par + 2;
  trace.text = choice.text;
  trace.done = false;
  trace.round++;

  clearGraph();
  addNode(choice.from);
  var goalNode = addNode(choice.to);
  goalNode.x += 260;
  select(null);
  paintTrace();
}

function randomChallenge() {
  var big = DATA.nodes.filter(function (n) { return n.deg >= 3; });
  for (var attempt = 0; attempt < 60; attempt++) {
    var from = pick(big).id;
    var dist = distanceMap(from);
    var far = Object.keys(dist).filter(function (id) {
      return dist[id] >= 3 && dist[id] <= 4 && NODE[id].deg >= 2;
    });
    if (!far.length) continue;
    var to = pick(far);
    return {
      from: from, to: to, par: dist[to],
      text: 'Find a route from <em>' + label(from) + '</em> to <em>' + label(to) + '</em>.'
    };
  }
  return null;
}

function traceMove(id) {
  if (!trace.on || trace.done) return;
  var legal = ADJ[trace.at].some(function (nb) { return nb.id === id; });
  if (!legal) return;
  traceStep(id);
}

function traceStep(id) {
  var prev = trace.at;
  var link = ADJ[prev].filter(function (nb) { return nb.id === id; })[0];
  var key = null;
  if (link) {
    var e = link.edge;
    key = e.s + '|' + e.r + '|' + e.t;
    pathHighlight[key] = true;
  }
  addNode(id, prev);
  trace.at = id;
  trace.path.push(id);
  trace.keys.push(key);
  trace.moves--;

  if (id === trace.goal) {
    trace.done = true;
    var steps = trace.path.length - 1;
    var gain = 100 + Math.max(0, trace.moves) * 25 + (steps === trace.par ? 50 : 0);
    trace.score += gain;
    if (trace.score > save.traceBest) { save.traceBest = trace.score; persist(); }
    trace.result = { win: true, gain: gain, steps: steps };
  } else if (trace.moves <= 0) {
    trace.done = true;
    trace.result = { win: false };
  }
  paintTrace();
  draw();   // addNode is a no-op when the node is already up, but the highlight moved
}

/* Step back up the path. A wrong turn you take back costs nothing: the move is
   refunded, so the only thing that counts is the route you finish on. */
function traceBack() {
  if (!trace.on || trace.done || trace.path.length < 2) return;
  trace.path.pop();
  trace.keys.pop();
  trace.at = trace.path[trace.path.length - 1];
  trace.moves++;

  // Rebuild rather than unset the one key: a path may cross the same link twice,
  // and unsetting would wipe a highlight the remaining path still needs.
  pathHighlight = {};
  trace.keys.forEach(function (k) { if (k) pathHighlight[k] = true; });

  paintTrace();
  draw();
}

function paintTrace() {
  $('game-title').textContent = 'Trace  ·  round ' + trace.round;
  $('game-score').innerHTML = 'score <b>' + trace.score + '</b>  ·  best ' + save.traceBest;
  $('game-prompt').innerHTML = trace.text;

  var path = $('game-path');
  path.innerHTML = '';
  trace.path.forEach(function (id, i) {
    if (i) path.appendChild(el('span', 'arrow', '→'));
    path.appendChild(el('span', 'step', label(id)));
  });
  if (!trace.done) {
    path.appendChild(el('span', 'arrow', ' … '));
    path.appendChild(el('span', null, label(trace.goal)));
    path.appendChild(el('span', null,
      '   (' + trace.moves + ' move' + (trace.moves === 1 ? '' : 's') + ' left, par ' + trace.par +
      (trace.path.length > 1 ? ' · going back is free' : '') + ')'));
  }

  var box = $('game-choices');
  box.innerHTML = '';

  $('game-back').hidden = trace.done || trace.path.length < 2;

  if (trace.done) {
    var msg = el('p', 'feedback ' + (trace.result.win ? 'ok' : 'no'));
    if (trace.result.win) {
      msg.textContent = 'Got there in ' + trace.result.steps + ' step' +
        (trace.result.steps === 1 ? '' : 's') + ' (par ' + trace.par + '). +' + trace.result.gain + ' points.';
    } else {
      var best = shortestPath(trace.path[0], trace.goal) || [];
      msg.textContent = 'Out of moves. One shortest route was: ' +
        best.map(label).join(' → ') + '.';
    }
    box.appendChild(msg);
    $('game-next').textContent = 'Next round';
    return;
  }

  $('game-next').textContent = 'Skip';

  // Choices: every neighbour, but capped, always including a correct next step.
  var dist = distanceMap(trace.goal);
  var neighbours = ADJ[trace.at].slice();
  var good = neighbours.filter(function (nb) { return dist[nb.id] === dist[trace.at] - 1; });
  var rest = shuffle(neighbours.filter(function (nb) { return good.indexOf(nb) === -1; }));
  var shown = shuffle(good.slice(0, 2).concat(rest.slice(0, 7 - Math.min(2, good.length))));

  shown.forEach(function (nb) {
    var b = el('button');
    var sw = el('span', 'swatch');
    sw.style.background = color(nb.id);
    b.appendChild(sw);
    b.appendChild(el('span', 'rel', nb.phrase));
    b.appendChild(el('span', null, label(nb.id)));
    b.addEventListener('click', function () { traceStep(nb.id); });
    box.appendChild(b);
  });
}

/* ---------------------------------------------------------------- quiz game */

var quiz = { q: null, asked: 0, right: 0, streak: 0, score: 0 };

/* Questions are always phrased in the active direction — "which of these
   senses DNA viruses?" rather than "DNA viruses is sensed by which of these?".
   Asking backwards would need the passive phrase, and the passive collides with
   plural subjects (infection types) in a way no simple rule fixes. */
var NEEDS_IS = { 'linked to': 1, 'mutated in': 1, 'part of': 1,
                 'important against': 1 };

function phrasing(phrase) {
  return NEEDS_IS[phrase] ? 'is ' + phrase : phrase;
}

function makeQuestion() {
  for (var attempt = 0; attempt < 80; attempt++) {
    var e = pick(DATA.edges);
    var backwards = Math.random() < 0.5;
    var from = backwards ? e.t : e.s;
    var answer = backwards ? e.s : e.t;
    var phrase = phrasing(RELS[e.r].label);
    if (NODE[from].deg < 2) continue;

    // Distractors: same type as the answer, not linked to `from` at all.
    var linked = {};
    ADJ[from].forEach(function (nb) { linked[nb.id] = 1; });
    var pool = DATA.nodes.filter(function (n) {
      return n.type === NODE[answer].type && n.id !== answer && !linked[n.id];
    });
    if (pool.length < 3) continue;

    var options = shuffle(shuffle(pool).slice(0, 3).map(function (n) { return n.id; }).concat([answer]));
    return {
      text: backwards
        ? 'Which of these ' + phrase + ' <em>' + label(from) + '</em>?'
        : '<em>' + label(from) + '</em> ' + phrase + ' which of these?',
      from: from, answer: answer, options: options, edge: e
    };
  }
  return null;
}

function quizNext() {
  quiz.q = makeQuestion();
  quiz.answered = false;
  paintQuiz();
}

function quizAnswer(id, button) {
  if (quiz.answered) return;
  quiz.answered = true;
  quiz.asked++;
  var right = id === quiz.q.answer;
  if (right) {
    quiz.right++;
    quiz.streak++;
    quiz.score += 10 + quiz.streak * 2;
    if (quiz.score > save.quizBest) { save.quizBest = quiz.score; persist(); }
  } else {
    quiz.streak = 0;
  }

  // Reveal the real link on the map.
  var e = quiz.q.edge;
  addNode(e.s);
  addNode(e.t, e.s);
  pathHighlight[e.s + '|' + e.r + '|' + e.t] = true;
  select(quiz.q.answer);

  Array.prototype.forEach.call($('game-choices').children, function (b) {
    b.disabled = true;
    if (b.__id === quiz.q.answer) b.className = 'right';
    else if (b.__id === id) b.className = 'wrong';
  });

  var n = NODE[quiz.q.answer];
  var msg = el('p', 'feedback ' + (right ? 'ok' : 'no'));
  msg.innerHTML = (right ? '' : 'The answer is <b>' + n.label + '</b>. ') +
    (n.desc || n.effect || (label(quiz.q.from) + ' → ' + n.label + '.'));
  $('game-choices').appendChild(msg);

  // The map is a teaching aid, not an authority: a link it does not hold is
  // not necessarily a link that does not exist.
  if (!right) {
    $('game-choices').appendChild(el('p', 'caveat',
      'The connection was marked wrong. Please confirm online if the ' +
      'connection is indeed wrong. This map was created with an undergraduate ' +
      'introductory immunology course in mind, and it might not cover more ' +
      'in-depth immunology concepts.'));
  }
  $('game-next').textContent = 'Next question';
  paintQuizHead();
}

function paintQuizHead() {
  $('game-title').textContent = 'Quiz';
  $('game-score').innerHTML = 'score <b>' + quiz.score + '</b>  ·  ' + quiz.right + '/' + quiz.asked +
    (quiz.streak > 1 ? '  ·  streak ' + quiz.streak : '') + '  ·  best ' + save.quizBest;
}

function paintQuiz() {
  paintQuizHead();
  $('game-back').hidden = true;      // stepping back is a Trace idea only
  $('game-path').innerHTML = '';
  $('game-prompt').innerHTML = quiz.q ? quiz.q.text : 'No question available.';
  var box = $('game-choices');
  box.innerHTML = '';
  if (!quiz.q) return;
  quiz.q.options.forEach(function (id) {
    var b = el('button');
    b.__id = id;
    var sw = el('span', 'swatch');
    sw.style.background = color(id);
    b.appendChild(sw);
    b.appendChild(el('span', null, label(id)));
    b.addEventListener('click', function () { quizAnswer(id, b); });
    box.appendChild(b);
  });
}

/* -------------------------------------------------------------------- modes */

function setMode(next) {
  mode = next;
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
    b.classList.toggle('active', b.dataset.mode === next);
  });
  closeWheel();
  $('game-panel').hidden = next === 'explore';
  $('hint').hidden = next !== 'explore';
  $('hint').textContent = wholeMap ? HINT_WHOLE : HINT_EXPLORE;

  if (next === 'trace') { pathHighlight = {}; traceStart(); }
  else if (next === 'quiz') { clearGraph(); quizNext(); }
  draw();
}

Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
  b.addEventListener('click', function () { setMode(b.dataset.mode); });
});

$('game-back').addEventListener('click', traceBack);

$('game-next').addEventListener('click', function () {
  if (mode === 'trace') traceStart();
  else quizNext();
});
$('game-restart').addEventListener('click', function () {
  if (mode === 'trace') { trace.score = 0; trace.round = 0; traceStart(); }
  else { quiz.score = 0; quiz.asked = 0; quiz.right = 0; quiz.streak = 0; clearGraph(); quizNext(); }
});

var HINT_EXPLORE = 'Click a node to open its wheel · drag to move · scroll to zoom · ' +
                   '✕ or Delete removes a node from the map';

// Delete/Backspace removes the selected node, as long as you are not typing
// into the search box at the time.
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Delete' && ev.key !== 'Backspace') return;
  var el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
  if (mode !== 'explore' || !selected || !live[selected]) return;
  ev.preventDefault();
  removeNode(selected);
});
var HINT_WHOLE = 'The whole map · click a node to light up its links · scroll to zoom in ' +
                 'for the rest of the labels';

$('show-all').addEventListener('click', function () {
  if (mode !== 'explore') setMode('explore');
  showWholeMap();
  $('hint').textContent = HINT_WHOLE;
});

$('reset-view').addEventListener('click', function () {
  clearGraph();
  view = { x: 0, y: 0, k: 1 };
  $('hint').textContent = HINT_EXPLORE;
  if (mode !== 'explore') setMode('explore');
  draw();
});

$('reset-progress').addEventListener('click', function () {
  if (!confirm('Clear everything you have uncovered so far?')) return;
  save = { found: {}, traceBest: 0, quizBest: 0 };
  persist();
  paintProgress();
});

/* --------------------------------------------------------------------- boot */

var STARTERS = ['macrophage', 'th1', 'dendritic-cell', 'b-cell', 'neutrophil',
                'nk-cell', 'treg', 'mycobacterium-tuberculosis', 'tlr4', 'ifn-gamma',
                'intracellular-bacteria', 'fungi', 'rna-viruses',
                'complement-system', 'caspase-1', 'mhc-ii'];

STARTERS.filter(function (id) { return NODE[id]; }).forEach(function (id) {
  var b = el('button', null, label(id));
  b.style.borderColor = color(id) + '66';
  b.addEventListener('click', function () { focusNode(id); });
  $('starter-buttons').appendChild(b);
});

Object.keys(TYPES).forEach(function (key) {
  if (key === 'other') return;
  var item = el('div', 'legend-item');
  var dot = el('i');
  dot.style.background = TYPES[key].color;
  item.appendChild(dot);
  item.appendChild(el('span', null, TYPES[key].label));
  $('legend-items').appendChild(item);
});

paintProgress();
paintInfo(null);
addNode('macrophage');
select('macrophage');
openWheel('macrophage');
frame();

})();
